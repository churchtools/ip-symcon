<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Selbstkorrektur: heizt der Raum zu schnell, steigt die gelernte Rate und die nächste Rampe wird kürzer; heizt er zu langsam, sinkt die Rate und die Rampe wird länger">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c6675"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="260" rx="14" fill="#ffffff" stroke="#d9dee6"/>
  <text x="30" y="38" font-size="18" font-weight="700" fill="#1a1f29">Warum es „intelligenter" wird: Selbstkorrektur</text>
  <text x="30" y="59" font-size="13" fill="#5c6675">Jede Buchung = 1 Messpunkt. Die letzten 20 werden gespeichert und angezeigt.</text>

  <!-- row 1: too fast -->
  <g font-size="12.5">
    <rect x="30" y="86" width="180" height="44" rx="8" fill="#eef7f0" stroke="#1f9d55"/>
    <text x="120" y="105" text-anchor="middle" fill="#1a1f29">Raum zu früh warm</text>
    <text x="120" y="122" text-anchor="middle" fill="#5c6675" font-size="11">(Prognose war zu lang)</text>

    <rect x="360" y="86" width="180" height="44" rx="8" fill="#ffffff" stroke="#e8621d"/>
    <text x="450" y="105" text-anchor="middle" fill="#e8621d">Heizrate ↑</text>
    <text x="450" y="122" text-anchor="middle" fill="#5c6675" font-size="11">Modell wird schneller</text>

    <rect x="690" y="86" width="180" height="44" rx="8" fill="#fff4ec" stroke="#e8621d"/>
    <text x="780" y="105" text-anchor="middle" fill="#1a1f29">nächste Rampe kürzer</text>
    <text x="780" y="122" text-anchor="middle" fill="#5c6675" font-size="11">→ nach hinten</text>
  </g>

  <!-- row 2: too slow -->
  <g font-size="12.5">
    <rect x="30" y="170" width="180" height="44" rx="8" fill="#eef3fb" stroke="#2f7de1"/>
    <text x="120" y="189" text-anchor="middle" fill="#1a1f29">bei Start noch kalt</text>
    <text x="120" y="206" text-anchor="middle" fill="#5c6675" font-size="11">(Prognose war zu kurz)</text>

    <rect x="360" y="170" width="180" height="44" rx="8" fill="#ffffff" stroke="#2f7de1"/>
    <text x="450" y="189" text-anchor="middle" fill="#2f7de1">Heizrate ↓</text>
    <text x="450" y="206" text-anchor="middle" fill="#5c6675" font-size="11">Modell wird langsamer</text>

    <rect x="690" y="170" width="180" height="44" rx="8" fill="#eef3fb" stroke="#2f7de1"/>
    <text x="780" y="189" text-anchor="middle" fill="#1a1f29">nächste Rampe länger</text>
    <text x="780" y="206" text-anchor="middle" fill="#5c6675" font-size="11">→ nach vorn</text>
  </g>

  <!-- arrows -->
  <g stroke="#5c6675" stroke-width="1.6" fill="none">
    <path d="M210,108 L358,108" marker-end="url(#ar)"/>
    <path d="M540,108 L688,108" marker-end="url(#ar)"/>
    <path d="M210,192 L358,192" marker-end="url(#ar)"/>
    <path d="M540,192 L688,192" marker-end="url(#ar)"/>
  </g>
</svg>
